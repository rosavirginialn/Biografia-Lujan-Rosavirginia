<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">    
    <link href="https://fonts.googleapis.com/css?family=Cossette+Texte:regular,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="franja-blanca">
        <h1>¡Bienvenidos a mi Base Secreta!</h1>
    </div>
    <div class="franja-blanca">
        <h2><span class="nombre">Rosavirginia Luján</span> | Reimaginando el Futuro desde San Francisco, Venezuela.</h2>
        <p class="sub-info">¡Lista para la aventura!</p>
    </div>

    <div class="contenedor-exploradores">
        <img src="img/exploradores.png" alt="Exploradores" class="img-exploradores">
    </div>
    <div class="franja-blanca">
        <h2 class="titulo-mision-selecion">Elige la misión:</h2>
    </div>

        <!-- Misiones -->
        <div class="contenedor-misiones grid-simetrico">
            <div class="mision-item">
                <div class="personaje-wrapper"><img src="img/exploradora.png" alt="¿Quién es la exploradora?"></div>
                <a href="misiones/reconocimiento.html">
                    <button class="btn-mision">¿Quién es la exploradora?</button>
                </a>
            </div>

            <div class="mision-item">
                <div class="personaje-wrapper"><img src="img/uniqua.png" alt="Origen"></div>
                <a href="misiones/origen.html">
                    <button class="btn-mision">Origen de la Exploradora</button>
                </a>
            </div>

            <div class="mision-item">
                <div class="personaje-wrapper"><img src="img/pablo.png" alt="Trayectoria"></div>
                <a href="misiones/formacion.html">
                    <button class="btn-mision">Formación</button>
                </a>
            </div>

            <div class="mision-item">
                <div class="personaje-wrapper"><img src="img/tyrone.png" alt="Logros"></div>
                <a href="misiones/logros.html">
                    <button class="btn-mision">Logros</button>
                </a>
            </div>

            <div class="mision-item">
                <div class="personaje-wrapper"><img src="img/tasha.png" alt="Actualidad"></div>
                <a href="misiones/actualidad.html">
                    <button class="btn-mision">Actualidad</button>
                </a>
            </div>
        </div>

        <!-- Contacto -->
        <div class="contenedor-contacto">
                <a href="misiones/contactos.html">
                    <button class="btn-mision btn-contacto-solo">Contactos</button>
                </a>
            </div>
    </body>
</html>
